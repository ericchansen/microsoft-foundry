# Capability matrix — capabilities Microsoft publishes only as documentation tables.
#
# WHY THIS FILE EXISTS
# --------------------
# `foundry regions` prefers live evidence: ARM tells us which regions exist, which
# resource types can be created, which models are deployable and how much quota we
# have. Some capabilities have no such API. For those, and only those, we record the
# published region list here.
#
# RULES FOR EVERY ENTRY
#   * `source` must be a first-party Microsoft URL.
#   * `as_of` is the date a human last checked that URL.
#   * `regions` uses the Azure *display* names exactly as the source page prints them.
#     They are normalised (lowercase, punctuation stripped) before matching, so
#     "East US 2" and "eastus2" both resolve.
#
# If a capability later gains an API, delete its entry here and add a live gate.

version: 1
review_cadence_days: 90

capabilities:
  apim_basic_v2:
    label: API Management Basic v2 tier
    source: https://learn.microsoft.com/azure/api-management/api-management-region-availability
    as_of: 2026-08-24
    note: >-
      Basic v2 is the cheapest v2 tier with an SLA. The v2 tiers are available in a
      narrower set of regions than API Management itself, so ARM's resource-type
      locations for Microsoft.ApiManagement/service are not a sufficient test.
    regions:
      - Australia Central
      - Australia East
      - Australia Southeast
      - Brazil South
      - Canada Central
      - Canada East
      - Central India
      - Central US
      - East Asia
      - East US
      - East US 2
      - France Central
      - Germany West Central
      - Italy North
      - Japan East
      - Korea Central
      - North Central US
      - North Europe
      - Norway East
      - South Africa North
      - South Central US
      - South India
      - Southeast Asia
      - Spain Central
      - Sweden Central
      - Switzerland North
      - UAE North
      - UK West
      - West Europe
      - West US
      - West US 2
    excluded_regions:
      # Listed on the source page as Standard v2 only.
      - Malaysia West
      - New Zealand North
      - West US 3
      # Listed as temporarily unavailable for new instance creation. A region we
      # cannot provision into today is not a candidate today.
      - UK South

  azure_sre_agent:
    label: Azure SRE Agent
    source: https://learn.microsoft.com/azure/sre-agent/supported-regions
    as_of: 2026-08-24
    note: >-
      Billed in Azure Agent Units. The service has no entry in the Azure Retail
      Prices API, which is why the cost model holds an explicit budget reserve for
      it rather than assuming it is free.
