  logic_apps_agent_loop:
    label: Logic Apps agent loop (agentic workflows)
    source: https://learn.microsoft.com/azure/logic-apps/agent-workflows-concepts
    as_of: 2026-08-24
    status: public-preview
    note: >-
      PUBLIC PREVIEW. Microsoft does not publish a region table for agentic
      workflows. The documentation states the agent's model is provisioned from
      Azure OpenAI, so support follows Foundry availability. We therefore derive
      this capability from `foundry_project` rather than inventing a list. The
      billing meters ("Consumption Agent Loop Input Token" / "Output Token") do
      exist in the Retail Prices API and are priced in the cost model.
    derives_from: foundry_project

  power_platform_co_residency:
    label: Power Platform / Copilot Studio co-residency
    sources:
      - https://learn.microsoft.com/power-platform/admin/regions-overview
      - https://learn.microsoft.com/microsoft-copilot-studio/data-location
    source: https://learn.microsoft.com/microsoft-copilot-studio/data-location
    as_of: 2026-08-24
    note: >-
      Copilot Studio stores data in the Azure geography matching the Power Platform
      environment. This gate keeps the Azure workload in a geography where a Power
      Platform environment can be co-located, so the two halves of the platform do
      not straddle a data boundary. India and Australia are excluded because
      Power Platform restricts those regions to India- and Australia-based tenants.
