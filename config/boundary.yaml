# Ownership boundary — the single blast radius for this project.
#
# THE RULE
#   Everything this project creates, assigns or deletes lives inside ONE resource
#   group. Every other resource group, identity, App Insights instance, agent,
#   endpoint and role assignment in the subscription belongs to somebody else and
#   is read-only.
#
# `foundry boundary` validates this file before anything is provisioned, and
# refuses to create the resource group if any check fails.
#
# Scopes below are RELATIVE to the resource group on purpose. A relative scope
# cannot name another subscription or resource group, so the boundary is enforced
# by the shape of the data rather than by reviewer attention.

version: 1

resource_group: rg-contoso-agents

# Later deployments may reuse only this project's own group. The live gate proves
# ownership tags and the complete resource inventory before accepting it.
allow_existing_resource_group: true

tags:
  project: contoso-agents
  managed-by: microsoft-foundry-demo
  boundary: rg-contoso-agents
  cost-centre: demo

# Resources v1 intends to create. Phase 0 creates none of them; this is the
# declared plan the boundary check validates ahead of later stacked PRs.
resources:
  - name: foundry-account
    kind: Microsoft.CognitiveServices/accounts
    scope: providers/Microsoft.CognitiveServices/accounts/contoso-agents-foundry
  - name: travel-project
    kind: Microsoft.CognitiveServices/accounts/projects
    scope: providers/Microsoft.CognitiveServices/accounts/contoso-agents-foundry/projects/travel
  - name: support-project
    kind: Microsoft.CognitiveServices/accounts/projects
    scope: providers/Microsoft.CognitiveServices/accounts/contoso-agents-foundry/projects/support
  - name: research-project
    kind: Microsoft.CognitiveServices/accounts/projects
    scope: providers/Microsoft.CognitiveServices/accounts/contoso-agents-foundry/projects/research
  - name: platform-project
    kind: Microsoft.CognitiveServices/accounts/projects
    scope: providers/Microsoft.CognitiveServices/accounts/contoso-agents-foundry/projects/platform
  - name: log-analytics
    kind: Microsoft.OperationalInsights/workspaces
    scope: providers/Microsoft.OperationalInsights/workspaces/contoso-agents-logs
  - name: app-insights
    kind: microsoft.insights/components
    scope: providers/microsoft.insights/components/contoso-agents-insights
  - name: app-insights-failure-anomalies
    kind: Microsoft.AlertsManagement/smartDetectorAlertRules
    scope: providers/Microsoft.AlertsManagement/smartDetectorAlertRules/*contoso-agents-insights
  - name: key-vault
    kind: Microsoft.KeyVault/vaults
    scope: providers/Microsoft.KeyVault/vaults/contoso-agents-kv-*
  - name: storage
    kind: Microsoft.Storage/storageAccounts
    scope: providers/Microsoft.Storage/storageAccounts/contosoagents*
  - name: container-registry
    kind: Microsoft.ContainerRegistry/registries
    scope: providers/Microsoft.ContainerRegistry/registries/contosoagents*
  - name: action-group
    kind: Microsoft.Insights/actionGroups
    scope: providers/Microsoft.Insights/actionGroups/contoso-agents-alerts
  - name: monthly-budget
    kind: Microsoft.Consumption/budgets
    scope: providers/Microsoft.Consumption/budgets/contoso-agents-monthly
  - name: api-management
    kind: Microsoft.ApiManagement/service
    scope: providers/Microsoft.ApiManagement/service/contoso-agents-gateway
  - name: sre-agent
    kind: Microsoft.App/agents
    scope: providers/Microsoft.App/agents/contoso-agents-sre-control-plane
  - name: approvals-loop
    kind: Microsoft.Logic/workflows
    scope: providers/Microsoft.Logic/workflows/contoso-agents-approvals-loop

# Identities. All are created inside the boundary. Reusing any pre-existing
# identity is rejected by the `plan:no-reuse` check.
identities:
  - name: agent-runtime-identity
    kind: Microsoft.ManagedIdentity/userAssignedIdentities
    scope: providers/Microsoft.ManagedIdentity/userAssignedIdentities/contoso-agents-runtime
    reuse_existing: false
  - name: github-deploy-identity
    kind: Microsoft.ManagedIdentity/userAssignedIdentities
    scope: providers/Microsoft.ManagedIdentity/userAssignedIdentities/contoso-agents-github-deploy
    reuse_existing: false
  - name: sre-agent-identity
    kind: Microsoft.ManagedIdentity/userAssignedIdentities
    scope: providers/Microsoft.ManagedIdentity/userAssignedIdentities/contoso-agents-sre
    reuse_existing: false
  - name: approvals-loop-identity
    kind: Microsoft.ManagedIdentity/userAssignedIdentities
    scope: providers/Microsoft.ManagedIdentity/userAssignedIdentities/contoso-agents-approvals
    reuse_existing: false

# Role assignments. Every scope is inside the resource group; nothing is granted
# at subscription or management-group level.
role_assignments:
  - name: runtime-reads-foundry
    role: Foundry User
    principal: agent-runtime-identity
    scope: providers/Microsoft.CognitiveServices/accounts/contoso-agents-foundry
  - name: deploy-contributor
    role: Contributor
    principal: github-deploy-identity
    scope: .
  - name: deploy-rbac-administrator
    role: Role Based Access Control Administrator
    principal: github-deploy-identity
    scope: .
  - name: travel-reads-logs
    role: Log Analytics Reader
    principal: travel-project
    scope: providers/microsoft.insights/components/contoso-agents-insights
  - name: travel-reads-monitoring-data
    role: Privileged Monitoring Data Reader
    principal: travel-project
    scope: providers/microsoft.insights/components/contoso-agents-insights
  - name: support-reads-logs
    role: Log Analytics Reader
    principal: support-project
    scope: providers/microsoft.insights/components/contoso-agents-insights
  - name: support-reads-monitoring-data
    role: Privileged Monitoring Data Reader
    principal: support-project
    scope: providers/microsoft.insights/components/contoso-agents-insights
  - name: research-reads-logs
    role: Log Analytics Reader
    principal: research-project
    scope: providers/microsoft.insights/components/contoso-agents-insights
  - name: research-reads-monitoring-data
    role: Privileged Monitoring Data Reader
    principal: research-project
    scope: providers/microsoft.insights/components/contoso-agents-insights
  - name: platform-reads-logs
    role: Log Analytics Reader
    principal: platform-project
    scope: providers/microsoft.insights/components/contoso-agents-insights
  - name: platform-reads-monitoring-data
    role: Privileged Monitoring Data Reader
    principal: platform-project
    scope: providers/microsoft.insights/components/contoso-agents-insights
  - name: sre-user-reads-owned-resources
    role: Reader
    principal: sre-agent-identity
    scope: .
  - name: sre-user-reads-monitoring
    role: Monitoring Reader
    principal: sre-agent-identity
    scope: .
  - name: sre-user-reads-logs
    role: Log Analytics Reader
    principal: sre-agent-identity
    scope: providers/microsoft.insights/components/contoso-agents-insights
  - name: sre-system-reads-owned-resources
    role: Reader
    principal: sre-agent
    scope: .
  - name: sre-system-reads-monitoring
    role: Monitoring Reader
    principal: sre-agent
    scope: .
  - name: sre-system-reads-logs
    role: Log Analytics Reader
    principal: sre-agent
    scope: providers/microsoft.insights/components/contoso-agents-insights

diagnostic_settings:
  - name: approvals-platform-logs
    kind: Microsoft.Insights/diagnosticSettings
    scope: providers/Microsoft.Logic/workflows/contoso-agents-approvals-loop

# Teardown. Deleting the resource group removes everything above in one action,
# which is the point of keeping the blast radius to a single group.
teardown:
  - name: delete-resource-group
    kind: resource-group
    scope: .
    note: az group delete -n rg-contoso-agents --yes

# Components that live OUTSIDE Azure and therefore outside this boundary. They
# cannot be torn down by deleting the resource group, so they are inventoried
# here explicitly and must be removed by hand.
external_teardown:
  - name: power-platform-environment
    system: Power Platform
    note: >-
      A dedicated "Contoso Agents" environment. Not created by this project's
      automation because it is a tenant-scope mutation outside the Azure boundary.
      Delete from the Power Platform admin centre.
    reference: https://learn.microsoft.com/power-platform/admin/create-environment
  - name: copilot-studio-agent
    system: Microsoft Copilot Studio
    note: Concierge agent and any tenant-wide publication. Unpublish before deleting.
    reference: https://learn.microsoft.com/microsoft-copilot-studio/publication-fundamentals-publish-channels