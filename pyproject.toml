[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contoso-foundry"
version = "0.1.0"
description = "Verification tooling for the Contoso agent platform demo on Microsoft Foundry"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "PyYAML>=6.0.2,<7",
    "requests>=2.32.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4,<9",
    "ruff>=0.9.2,<1",
    "pymarkdownlnt>=0.9.30,<1",
]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.5.49,<10",
    "pymdown-extensions>=10.14,<11",
]

[project.scripts]
foundry = "contoso_foundry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
