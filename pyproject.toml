[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contoso-foundry"
version = "0.1.0"
description = "Verification tooling for the Contoso agent platform demo on Microsoft Foundry"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "PyYAML>=6.0.2,<7",
    "requests>=2.32.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4,<9",
    "ruff>=0.9.2,<1",
    "pymarkdownlnt>=0.9.30,<1",
    # The Travel scheduling tests resolve IANA zones. Linux ships a system zone
    # database; Windows does not, so the suite needs a portable one to be
    # runnable on every platform a contributor might use.
    "tzdata>=2025.2",
]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.5.49,<10",
    "pymdown-extensions>=10.14,<11",
]
research = [
    "azure-ai-projects>=2.5,<3",
    "azure-identity>=1.25.3,<2",
    "langchain>=1.3.15,<2",
    "langchain-azure-ai[hosting,opentelemetry]>=1.2.8,<2",
    "langchain-openai>=1.5.2,<2",
    "langgraph>=1.2.11,<2",
]
field = [
    "azure-ai-projects>=2.5.0,<3",
    "azure-identity>=1.25.3,<2",
    "azure-monitor-opentelemetry>=1.8.9,<2",
    "fastapi>=0.116.0,<1",
    "httpx>=0.28.0,<1",
    "opentelemetry-sdk>=1.43.0,<2",
    "pydantic-ai-slim[openai]>=2.0.0,<3",
    "uvicorn[standard]>=0.35.0,<1",
]
# Microsoft Presidio is a deep PII detector, and a heavy one: it pulls spaCy and
# a language model into a project that otherwise runs on PyYAML and requests.
# It earns its place as an *optional* second opinion over free text, not as a
# requirement. The privacy gate's primary defence is the closed-vocabulary check,
# which needs no model and cannot be fooled by a detector's recall.
pii = [
    "presidio-analyzer>=2.2.355,<3",
    "spacy>=3.7,<4",
]

[project.scripts]
foundry = "contoso_foundry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
