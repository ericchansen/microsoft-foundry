name: pages

# Publishes https://ericchansen.github.io/microsoft-foundry/.
#
# The scan step sits between build and upload on purpose: an artifact that has
# already been uploaded is already public, so the leak check has to be the last
# thing that can stop the deploy.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never race two deploys onto one site. Do not cancel in progress: a half-finished
# deploy is worse than a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -e ".[docs]"

      - name: Build site
        run: mkdocs build --strict

      - name: Scan generated site for identifiers and secrets
        run: foundry scan site

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
