name: infrastructure

on:
  pull_request:
    paths:
      - "config/gateway.yaml"
      - "infra/**"
      - "agents/field/deploy/**"
      - "src/contoso_foundry/gateway.py"
      - "tests/test_gateway.py"
      - "tests/test_infrastructure.py"
      - "tests/test_field_deploy.py"
      - ".github/workflows/infra.yml"
  workflow_dispatch:
    inputs:
      operation:
        description: Run a boundary-scoped what-if or deployment
        required: true
        type: choice
        options:
          - what-if
          - deploy
          - verify
      confirm_resource_group:
        description: Type rg-contoso-agents to authorize the selected operation
        required: true
        type: string
      existing_model_deployments_json:
        description: JSON array of deployments already created by dependency stacks; use [] for a clean deployment
        required: false
        default: "[]"
        type: string
      deploy_optional_platforms:
        description: Include disabled-by-default Azure SRE Agent and Logic Apps Approvals coverage
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    name: Bicep lint, build, and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Install Bicep
        run: az bicep install

      - uses: azure/setup-kubectl@v4

      - name: Enforce ownership boundary
        run: foundry boundary --no-live

      - name: Validate Control Plane platform declarations
        run: foundry platform-inventory --no-live

      - name: Lint and build without tracked ARM output
        run: |
          az bicep lint --file infra/main.bicep
          az bicep build --file infra/main.bicep --stdout >/dev/null
          az bicep build --file infra/gateway-association.bicep --stdout >/dev/null
          az bicep build --file infra/model-governance.bicep --stdout >/dev/null
          az bicep lint --file agents/field/deploy/container-apps.bicep
          az bicep build --file agents/field/deploy/container-apps.bicep --stdout >/dev/null
          kubectl kustomize agents/field/deploy/aks >/dev/null
          test ! -f infra/main.json

      - name: Infrastructure and gateway contracts
        run: pytest -q tests/test_infrastructure.py tests/test_gateway.py tests/test_field_deploy.py

  azure:
    name: ${{ inputs.operation }} protected environment
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: contoso-agents
    concurrency:
      group: azure-rg-contoso-agents
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      RESOURCE_GROUP: rg-contoso-agents
      RESOURCE_PREFIX: contoso-agents
      BUDGET_CONTACT_EMAIL: ${{ vars.BUDGET_CONTACT_EMAIL }}
      EXISTING_MODEL_DEPLOYMENTS_JSON: ${{ inputs.existing_model_deployments_json }}
      SRE_OPERATOR_GROUP_OBJECT_ID: ${{ vars.SRE_OPERATOR_GROUP_OBJECT_ID }}
      DEPLOY_OPTIONAL_PLATFORMS: ${{ inputs.deploy_optional_platforms }}
      FOUNDRY_MONTHLY_BUDGET_USD: ${{ vars.FOUNDRY_MONTHLY_BUDGET_USD }}
      CONFIRM_RESOURCE_GROUP: ${{ inputs.confirm_resource_group }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Load the derived deployment region
        run: |
          echo "FOUNDRY_LOCATION=$(python -c 'import yaml; print(yaml.safe_load(open("config/selected-region.yaml"))["region"])')" \
            >> "$GITHUB_ENV"

      - name: Require explicit boundary confirmation
        run: |
          test "$CONFIRM_RESOURCE_GROUP" = "$RESOURCE_GROUP"
          test -n "$BUDGET_CONTACT_EMAIL"
          test -n "$EXISTING_MODEL_DEPLOYMENTS_JSON"
          python -c "import json, os; assert isinstance(json.loads(os.environ['EXISTING_MODEL_DEPLOYMENTS_JSON']), list)"
          if test "$DEPLOY_OPTIONAL_PLATFORMS" = "true"; then
            test -n "$SRE_OPERATOR_GROUP_OBJECT_ID"
          fi

      - name: Enforce optional platform cost policy
        if: inputs.deploy_optional_platforms
        run: foundry costs --enable-module approvals --enable-module sre

      - name: Azure login with workload identity federation
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify live ownership boundary
        run: |
          if test "$DEPLOY_OPTIONAL_PLATFORMS" = "true"; then
            foundry boundary --enable-module optional-control-plane
          else
            foundry boundary
          fi

      - name: Verify owned resource group
        run: |
          test "$(az group show --name "$RESOURCE_GROUP" --query tags.boundary -o tsv)" = "$RESOURCE_GROUP"

      - name: Attest existing Foundry model deployments
        if: inputs.operation != 'verify'
        run: |
          foundry gateway attest-model-deployments \
            --model-deployments-json "$EXISTING_MODEL_DEPLOYMENTS_JSON"

      - name: Refuse concurrent resource-group deployments
        run: |
          active="$(az deployment group list \
            --resource-group "$RESOURCE_GROUP" \
            --query "[?properties.provisioningState=='Running' || properties.provisioningState=='Accepted'].name" \
            -o tsv)"
          test -z "$active"

      - name: What-if
        if: inputs.operation == 'what-if'
        run: |
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --parameters existingModelDeployments="$EXISTING_MODEL_DEPLOYMENTS_JSON" \
            --parameters deploySreAgent="$DEPLOY_OPTIONAL_PLATFORMS" \
            --parameters deployApprovalsWorkflow="$DEPLOY_OPTIONAL_PLATFORMS" \
            --parameters sreOperatorGroupObjectId="$SRE_OPERATOR_GROUP_OBJECT_ID"

      - name: Deploy
        if: inputs.operation == 'deploy'
        run: |
          az deployment group create \
            --name "gateway-governance-${GITHUB_RUN_ID}" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --parameters existingModelDeployments="$EXISTING_MODEL_DEPLOYMENTS_JSON" \
            --parameters deploySreAgent="$DEPLOY_OPTIONAL_PLATFORMS" \
            --parameters deployApprovalsWorkflow="$DEPLOY_OPTIONAL_PLATFORMS" \
            --parameters sreOperatorGroupObjectId="$SRE_OPERATOR_GROUP_OBJECT_ID"

      - name: Verify live gateway controls
        if: inputs.operation == 'verify'
        run: foundry gateway verify

      - name: Verify optional Control Plane coverage
        if: inputs.operation == 'verify' && inputs.deploy_optional_platforms
        run: foundry platform-inventory --include-optional
