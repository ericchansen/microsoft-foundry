# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: contoso-research-hosted
resourceGroup: rg-contoso-agents

requiredVersions:
  azd: ">=1.27.1"
  extensions:
    azure.ai.agents: ">=1.0.0-beta.8"
    azure.ai.projects: ">=1.0.0-beta.4"

services:
  research-project:
    host: azure.ai.project
    endpoint: ${CONTOSO_RESEARCH_PROJECT_ENDPOINT}
    deployments:
      - name: gpt-5.4-mini-2026-03-17
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: "2026-03-17"
        sku:
          name: GlobalStandard
          capacity: 10

  contoso-research:
    host: azure.ai.agent
    project: .
    language: docker
    docker:
      path: ./agents/research/Dockerfile
      context: .
      platform: linux/amd64
      remoteBuild: true
    image: ${CONTOSO_RESEARCH_IMAGE}
    uses:
      - research-project
    kind: hosted
    name: contoso-research
    description: Scoped research over canonical synthetic Contoso operations data.
    protocols:
      - protocol: responses
        version: 2.0.0
    agentEndpoint:
      protocols:
        - responses
      authorizationSchemes:
        - type: Entra
      versionSelector:
        versionSelectionRules:
          - type: FixedRatio
            agentVersion: "1"
            trafficPercentage: 100
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5.4-mini-2026-03-17
      CONTOSO_RESEARCH_USER_ROUTE_ALLOWLIST: ${CONTOSO_RESEARCH_USER_ROUTE_ALLOWLIST}
      CONTOSO_RESEARCH_VERSION: 1.0.0
      CONTOSO_RESEARCH_HOSTED_VERSION: "1"
      OTEL_SERVICE_NAME: contoso-research
      AZURE_TRACING_GEN_AI_CONTENT_RECORDING_ENABLED: "false"
    startupCommand: python -m contoso_foundry.research.hosted
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
    hooks:
      predeploy:
        windows:
          shell: pwsh
          run: $env:PYTHONPATH='src'; python -m contoso_foundry.research.deployment
          continueOnError: false
          interactive: false
        posix:
          shell: sh
          run: PYTHONPATH=src python -m contoso_foundry.research.deployment
          continueOnError: false
          interactive: false
