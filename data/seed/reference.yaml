# Leadership sits outside the operating departments so the org chart has a
# recognisable shape: one global lead, one director per region, one lead per
# department per region, then individual contributors. Four levels is enough for
# the hierarchy tools to be interesting and small enough to verify by eye.
leadership_department: Corporate

