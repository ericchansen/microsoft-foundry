# Curated reference data for the Contoso spine.
#
# These rows are hand-written rather than generated because they are the parts a
# human needs to recognise: the places Contoso operates, the fictitious companies
# it buys from, and the policies its agents are asked about. Everything else is
# derived from them.
#
# Every company name here is one of Microsoft's reserved fictitious companies.
# Every telephone number is in the 555-01xx fiction block. See data/MANIFEST.md.

