travel_policies:
  - policy_id: TPOL-AMER-01
    region: AMER
    title: Americas standard travel policy
    max_fare_class: economy
    advance_purchase_days: 14
    requires_approval_over: 1500
    summary: >-
      Economy fares only for flights under six hours. Bookings made fewer than
      fourteen days ahead need a line-manager note. Anything over 1,500 USD
      needs written approval before ticketing.
  - policy_id: TPOL-AMER-02
    region: AMER
    title: Americas field engineering travel policy
    max_fare_class: economy_plus
    advance_purchase_days: 3
    requires_approval_over: 2500
    summary: >-
      Field engineers responding to a priority work order may book at three
      days' notice and use economy plus on sectors over four hours.
  - policy_id: TPOL-EMEA-01
    region: EMEA
    title: EMEA standard travel policy
    max_fare_class: economy
    advance_purchase_days: 10
    requires_approval_over: 1200
    summary: >-
      Rail is the default for journeys under five hours between EMEA offices.
      Air travel on those routes needs a documented reason.
  - policy_id: TPOL-EMEA-02
    region: EMEA
    title: EMEA long-haul travel policy
    max_fare_class: economy_plus
    advance_purchase_days: 21
    requires_approval_over: 3000
    summary: >-
      Long-haul departures from EMEA are booked at least three weeks ahead.
      Economy plus is permitted where the flight exceeds eight hours.
  - policy_id: TPOL-APAC-01
    region: APAC
    title: APAC standard travel policy
    max_fare_class: economy
    advance_purchase_days: 10
    requires_approval_over: 1400
    summary: >-
      Economy fares within the region. Same-day returns are preferred over
      overnight stays on sectors under three hours.
  - policy_id: TPOL-APAC-02
    region: APAC
    title: APAC depot support travel policy
    max_fare_class: economy_plus
    advance_purchase_days: 5
    requires_approval_over: 2200
    summary: >-
      Depot support travel may be booked at five days' notice. Ground transfer
      to the depot is booked with the ticket, not expensed separately.

hr_policies:
  - hr_policy_id: HRP-GLOBAL-01
    region: GLOBAL
    title: Code of conduct
    category: conduct
    audience: all_employees
    effective_on: "2025-01-01"
    summary: >-
      How Contoso expects people to behave with each other, with customers and
      with company data. Applies everywhere without local variation.
  - hr_policy_id: HRP-GLOBAL-02
    region: GLOBAL
    title: Acceptable use of AI assistants
    category: technology
    audience: all_employees
    effective_on: "2025-09-01"
    summary: >-
      What may and may not be put into an AI assistant, and which categories of
      answer must be verified by a human before being acted on.
  - hr_policy_id: HRP-AMER-01
    region: AMER
    title: Americas leave and time off
    category: leave
    audience: all_employees
    effective_on: "2025-01-01"
    summary: >-
      Accrual rates, carry-over limits and the notice expected before booking
      leave for employees in the Americas.
  - hr_policy_id: HRP-AMER-02
    region: AMER
    title: Americas hybrid working standard
    category: working_pattern
    audience: all_employees
    effective_on: "2025-06-01"
    summary: >-
      The minimum number of days in a Contoso location per month, and how a
      fully remote exception is requested and reviewed.
  - hr_policy_id: HRP-EMEA-01
    region: EMEA
    title: EMEA leave and time off
    category: leave
    audience: all_employees
    effective_on: "2025-01-01"
    summary: >-
      Statutory minimums differ by country in EMEA. This policy sets the
      Contoso floor and points to the country annexes above it.
  - hr_policy_id: HRP-EMEA-02
    region: EMEA
    title: EMEA works council consultation
    category: employee_relations
    audience: people_managers
    effective_on: "2025-03-01"
    summary: >-
      When a change to working arrangements requires consultation, and the
      minimum consultation window before a change takes effect.
  - hr_policy_id: HRP-APAC-01
    region: APAC
    title: APAC leave and time off
    category: leave
    audience: all_employees
    effective_on: "2025-01-01"
    summary: >-
      Accrual, public holiday substitution and carry-over rules for employees
      in the Asia Pacific region.
  - hr_policy_id: HRP-APAC-02
    region: APAC
    title: APAC on-call and shift allowance
    category: compensation
    audience: people_managers
    effective_on: "2025-04-01"
    summary: >-
      How on-call rotations are compensated in support centres and depots, and
      the maximum consecutive on-call weeks permitted.

