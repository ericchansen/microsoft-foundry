support_subjects:
  - Device will not power on after firmware update
  - Intermittent packet loss on uplink port
  - Replacement part shipped to the wrong depot
  - Invoice does not match the delivered quantity
  - Request to extend warranty on a rack server
  - Docking station stops charging under load
  - Damaged carton reported on delivery
  - Access point drops clients above forty sessions
  - Safety helmet batch missing certification label
  - Scheduled maintenance visit needs rescheduling

support_note_bodies:
  customer:
    - Confirmed the fault with the customer and agreed a replacement window.
    - Shipped a like-for-like replacement unit and shared the tracking reference.
    - Asked the customer to confirm the serial number on the rear label.
    - Booked an engineer visit for the next available depot slot.
    - Closed the case after the customer confirmed the fix held for a week.
  internal:
    - Firmware revision matches the batch flagged by the supplier.
    - Depot stock is below reorder level, replenishment raised with supply chain.
    - Duplicate of an earlier case from the same site, linking for trend analysis.
    - Escalated to the field engineering lead for a second opinion.
    - Warranty position checked against the commercial agreement before committing.

work_order_tasks:
  - Replace failed uplink transceiver
  - Quarterly rack thermal inspection
  - Install additional access point in loading bay
  - Recertify uninterruptible power supply
  - Swap damaged patch panel
  - Commission replacement edge appliance
  - Annual safety equipment audit
  - Relocate depot workstation cluster
