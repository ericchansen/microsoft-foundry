# Pinned external datasets.
#
# Nothing here is committed. This file records *how* to obtain a corpus, at
# which exact revision, and what its licence permits — so an evaluation run is
# reproducible without the repository carrying content it has no right to
# redistribute.
#
# This repository intentionally has no downloader for restricted corpora.
# Authorized operators may stage a pinned source under the gitignored cache after
# reviewing its terms; repository verification never treats that cache as input.

version: 1

cache_dir: data/external/cache

datasets:
  - id: schema-guided-dialogue
    title: Schema-Guided Dialogue (DSTC8)
    homepage: https://github.com/google-research-datasets/dstc8-schema-guided-dialogue
    licence: CC-BY-SA-4.0
    licence_url: https://creativecommons.org/licenses/by-sa/4.0/
    # Pinned to a commit, not a branch: a branch moves and the evaluation stops
    # being reproducible the next time somebody runs it.
    ref: 9ba2b8f4d7ba0c0e3b8b7b6f9e5e9a1d2f0b7c31
    archive_url: https://github.com/google-research-datasets/dstc8-schema-guided-dialogue/archive/9ba2b8f4d7ba0c0e3b8b7b6f9e5e9a1d2f0b7c31.zip
    cache_subdirectory: schema-guided-dialogue
    use: >-
      Comparative reference for multi-domain tool-calling behaviour. Read
      locally; no derivative is written back into the repository.
    committed: false

  - id: contoso-spine
    title: Contoso spine (this repository)
    homepage: https://github.com/ericchansen/microsoft-foundry
    licence: Generated-Synthetic
    licence_url: https://github.com/ericchansen/microsoft-foundry
    ref: local
    archive_url: null
    cache_subdirectory: null
    use: >-
      The default evaluation corpus. Generated by 'foundry data build', so no
      fetch is required and evaluation works fully offline.
    committed: false
