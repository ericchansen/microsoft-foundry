# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: contoso-research

services:
  research-project:
    host: azure.ai.project
    endpoint: ${CONTOSO_RESEARCH_PROJECT_ENDPOINT}

  contoso-research:
    host: azure.ai.agent
    project: .
    language: docker
    uses:
      - research-project
    kind: hosted
    name: contoso-research
    description: Scoped research over canonical synthetic Contoso operations data.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${CONTOSO_RESEARCH_MODEL_DEPLOYMENT}
      CONTOSO_RESEARCH_PERSONA_ROUTE: americas-supply-planner
      CONTOSO_RESEARCH_VERSION: 1.0.0
      OTEL_SERVICE_NAME: contoso-research
      AZURE_TRACING_GEN_AI_CONTENT_RECORDING_ENABLED: 'false'
    startupCommand: python -m contoso_foundry.research.hosted
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
