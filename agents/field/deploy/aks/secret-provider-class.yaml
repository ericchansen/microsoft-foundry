apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: contoso-field
  namespace: contoso-agents
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: ${FIELD_CLIENT_ID}
    keyvaultName: ${KEY_VAULT_NAME}
    tenantId: ${TENANT_ID}
    objects: |
      array:
        - |
          objectName: field-runtime-config
          objectType: secret
          objectVersion: ""
